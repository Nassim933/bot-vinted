# Configuration utilisée par GitHub Actions (.github/workflows/alertes.yml).
# Ce fichier est public : ne mets JAMAIS de token ici.
# Le token et le chat_id Telegram viennent des secrets du dépôt
# (TELEGRAM_TOKEN et TELEGRAM_CHAT_ID).

[general]
domaine = "www.vinted.fr"
intervalle_secondes = 60

[[alertes]]
nom = "PS5"
recherche = "ps5"
prix_min = 150
prix_max = 350
mots_exclus = ["manette", "jeu", "jeux", "casque", "coque", "boite vide", "support", "virement", "paypal", "recherche", "cerco", "portal", "portable", "volant", "pédale", "logitech", "cherche"]
mots_requis = []
# L'annonce est ignorée si sa description contient l'un de ces mots
mots_exclus_description = ["paypal", "virement", "recherche", "cherche", "portal", "portable"]
# Nombre minimum d'avis reçus par le vendeur (1 = ignorer les vendeurs sans
# aucun avis, 0 = ne pas filtrer)
avis_min = 1
